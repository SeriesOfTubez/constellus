# The token Secret (planning#322 slice 2b-2), pre-created EMPTY by the manifests: the backend's
# Role is get + patch on this one name and has no create. The backend patches the keys
# `worker.json` and `proxy.json` (each: token, expires_at, boundary); the worker and proxy read
# them from slice 2b-3. `kubectl apply` of this file leaves those keys alone, because they were
# never in the last-applied configuration. The name must equal CAPTURE_TOKEN_SECRET (default
# capture-store-tokens).
apiVersion: v1
kind: Secret
metadata:
  name: capture-store-tokens
  namespace: constellus
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: constellus
type: Opaque
