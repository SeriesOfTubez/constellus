# capture-browser: headless Chromium worker (S3 mode). It never receives
# CAPTURE_PROXY_KEY (the backend mints per-job proxy tokens) and never receives the
# proxylog bucket. Secret capture-store-worker: CAPTURE_S3_ACCESS_KEY, CAPTURE_S3_SECRET_KEY
# (list/get/delete on jobs/ only).
#
# Chromium's own sandbox needs clone/unshare/chroot, which Docker's default seccomp
# profile blocks. The profile (capture-browser/seccomp.json) must be installed on
# EVERY node at <kubelet root>/seccomp/profiles/capture-browser.json
# (usually /var/lib/kubelet/seccomp/profiles/). The lab script does this via a kind mount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capture-browser
  namespace: constellus
  labels:
    app.kubernetes.io/name: capture-browser
    app.kubernetes.io/part-of: constellus
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture-browser
  namespace: constellus
  labels:
    app.kubernetes.io/name: capture-browser
    app.kubernetes.io/part-of: constellus
spec:
  replicas: 1
  # Not about safety since planning#323: workers claim jobs with a conditional PUT, so
  # several at once are safe on a store that honours If-None-Match (docs/deploy/
  # kubernetes.md). Recreate is kept so a rollout never overlaps two pod generations
  # (the lab's wait_browser_running counts live pods). Scale with an overlay.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: capture-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capture-browser
        app.kubernetes.io/part-of: constellus
    spec:
      serviceAccountName: capture-browser
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The container's PID 1 is capture.supervisor: it starts a fresh worker
      # process per capture and, between captures, kills every other process and
      # wipes /tmp, /home/capture and /dev/shm. restartPolicy Always (the
      # Deployment default) only covers supervisor exits (a failing worker), because
      # the kubelet's crash-loop back-off applies even to exit 0
      # (docs/deploy/kubernetes.md has the measured effect).
      restartPolicy: Always
      # MUST stay false: the supervisor refuses to start unless it is PID 1, and a
      # shared process namespace would make the pause container PID 1.
      shareProcessNamespace: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/capture-browser.json
      containers:
        - name: capture-browser
          image: constellus/capture-browser
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          env:
            - name: CAPTURE_PROXY_URL
              value: http://capture-proxy:3128
            - name: CAPTURE_STORE
              value: s3
            - name: CAPTURE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: capture-store
                  key: CAPTURE_S3_ENDPOINT
            - name: CAPTURE_S3_INSECURE_HTTP
              valueFrom:
                configMapKeyRef:
                  name: capture-store
                  key: CAPTURE_S3_INSECURE_HTTP
                  optional: true
            - name: CAPTURE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: capture-store
                  key: CAPTURE_S3_REGION
                  optional: true
            - name: CAPTURE_S3_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: capture-store
                  key: CAPTURE_S3_PATH_STYLE
                  optional: true
            - name: CAPTURE_S3_BUCKET_JOBS
              valueFrom:
                configMapKeyRef:
                  name: capture-store
                  key: CAPTURE_S3_BUCKET_JOBS
            - name: CAPTURE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: capture-store-worker
                  key: CAPTURE_S3_ACCESS_KEY
            - name: CAPTURE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: capture-store-worker
                  key: CAPTURE_S3_SECRET_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/capture
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: home
          emptyDir:
            medium: Memory
        # Compose's shm_size: 1gb. Chromium crashes on the 64 MB default.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
