services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql://constellus:constellus@db:5432/constellus
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRETS_PROVIDER=env
      - DATABASE_URL=postgresql://constellus:constellus@db:5432/constellus
      - SCANNER_URL=http://scanner-worker:8001
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN}
      - CAPTURE_SPOOL_DIR=/spool
      - CAPTURE_PROXYLOG_DIR=/proxylog
      - CAPTURE_PROXY_KEY=${CAPTURE_PROXY_KEY:-}
      - CAPTURE_IMAGES_DIR=/captures
      - CAPTURE_CONFIG_DIR=/capture_config
    env_file:
      - .env
    # Shared capture group (gid 10050): read/write the spool + proxy log volumes.
    group_add:
      - "10050"
    volumes:
      - capture_spool:/spool
      - capture_proxylog:/proxylog
      - capture_images:/captures
      - capture_config:/capture_config
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data

  scanner-worker:
    build:
      context: ./scanner-worker
      dockerfile: Dockerfile
    environment:
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN}
    env_file:
      - .env
    cap_add:
      - NET_RAW
    # Note: in production restrict this service to a network shared only with
    # the backend. Here it shares 'app' for simplicity — deployer should segment.
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_TARGET=http://backend:8000
    depends_on:
      - backend
    networks:
      - app

  db:
    # Stock PostgreSQL — Constellus requires no extensions. Was
    # timescale/timescaledb:latest-pg16 until the hypertables were removed.
    # Keep this in lockstep with the `db` service container in
    # .github/workflows/security.yml, or CI stops testing what dev runs.
    # See docs/getting-started/database-requirements.md.
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: constellus
      POSTGRES_PASSWORD: constellus
      POSTGRES_DB: constellus
    volumes:
      # NOT /var/lib/postgresql/data. From PostgreSQL 18 the official images
      # store data in major-version-specific subdirectories (…/18/docker) so
      # `pg_upgrade --link` can work across versions without crossing a mount
      # boundary. Mounting the old path makes the image refuse to start rather
      # than silently orphan the data. See docker-library/postgres#1259.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constellus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data

  # ── Page capture (planning#280 S5b-1) ─────────────────────────────────────
  # capture-browser has NO route out: it is only on `capture_internal`
  # (internal: true). capture-proxy is the only path to the world and is the
  # security boundary (authenticates, resolves + validates + pins every host,
  # logs every request). Neither service is on `app` or `data`: the browser must
  # never be able to reach the backend or the database.
  # CAPTURE_PROXY_KEY (held by backend + capture-proxy ONLY) uses `:-` rather than
  # `:?` on purpose: Compose interpolates EVERY service, profile-gated or not, so
  # `:?` would break plain `docker compose up -d` for anyone without the key in
  # .env. An empty or short key still fails closed: capture-proxy refuses to start
  # and the backend refuses to queue a capture (capture:not_configured).
  # capture-browser deliberately NEVER receives the key: the backend derives a
  # per-job token (HMAC of capture id + mode) and writes only that into the job.
  # Profile-gated: plain `docker compose up -d` does not start them yet.
  # capture-browser runs a PID-1 supervisor (`python -m capture.supervisor`) that
  # starts the spool worker (`capture.worker`) once per capture: it pulls a job
  # from /spool, captures ONE page, writes the result and exits. Between captures
  # the supervisor kills every other process in the container and wipes /tmp,
  # /home/capture and /dev/shm; the restart policy covers supervisor exits. It never connects to the
  # backend: jobs/results travel through volumes (docs/architecture/capture-spool.md).
  #   capture_spool     backend rw, capture-browser rw   (/spool)
  #   capture_proxylog  backend rw, capture-proxy rw     (/proxylog) - the browser
  #                     never mounts this, so it cannot forge the proxy's record
  #   capture_images    backend only                     (/captures)
  #   capture_config    backend rw, capture-proxy ro     (/capture_config)
  # Access is via the shared group gid 10050 (`group_add`), dirs 2770. Both images
  # pre-create /spool/{jobs,claimed,results} so either seeds an empty volume alike.
  # One-off runs (the egress spike): `docker compose --profile capture run --rm capture-browser <cmd>`
  capture-proxy:
    build:
      context: ./capture-proxy
      dockerfile: Dockerfile
    environment:
      - CAPTURE_PROXY_KEY=${CAPTURE_PROXY_KEY:-}
      - CAPTURE_PROXY_LOG_DIR=/proxylog
      - CAPTURE_LIMITS_FILE=/capture_config/proxy_limits.json
    volumes:
      - capture_proxylog:/proxylog
      - capture_config:/capture_config:ro
    group_add:
      - "10050"
    networks:
      - capture_internal
      - capture_egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles:
      - capture

  capture-browser:
    build:
      context: ./capture-browser
      dockerfile: Dockerfile
    environment:
      - CAPTURE_PROXY_URL=http://capture-proxy:3128
      - CAPTURE_SPOOL_DIR=/spool
    volumes:
      - capture_spool:/spool
    group_add:
      - "10050"
    restart: unless-stopped
    networks:
      - capture_internal
    read_only: true
    tmpfs:
      - /tmp
      - /home/capture
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile + clone/unshare/chroot, so Chromium's own sandbox
      # can run without any capability. See capture-browser/SECCOMP_SOURCE.md.
      - seccomp=./capture-browser/seccomp.json
    shm_size: "1gb"
    depends_on:
      - capture-proxy
    profiles:
      - capture

  # ── Test-only S3 store (planning#318 S1b) ────────────────────────────────
  # RustFS, pinned by digest. TEST ONLY: it backs the S3 conformance tests
  # (backend/app/tests/test_capture_store.py, param "s3") and nothing else.
  # Never a production default: production is bring-your-own S3 (CAPTURE_STORE=s3
  # + CAPTURE_S3_*, see docs/architecture/capture-spool.md); Compose keeps the
  # filesystem spool. Rails: the root credentials MUST come from .env (no default:
  # RustFS's pre-1.0 releases shipped hardcoded-credential CVEs; empty values are
  # allowed at parse time, because a `:?` required-variable would break `docker
  # compose up` for everyone, but RustFS 1.0.4 exits "must not be empty"), the console is
  # off, the S3 port binds to 127.0.0.1 only, data is a tmpfs, and the service
  # sits on `capture_store` (internal) plus the default network solely for the
  # localhost publish. Host port 9318 (not 9000: other local stacks publish
  # MinIO's default there). Run:
  #   docker compose --profile capture-s3-test up -d rustfs
  #   CAPTURE_S3_TEST_ENDPOINT=http://127.0.0.1:9318 CAPTURE_S3_TEST_ACCESS_KEY=… \
  #   CAPTURE_S3_TEST_SECRET_KEY=… bash backend/scripts/test.sh app/tests/test_capture_store.py
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      - RUSTFS_ACCESS_KEY=${CAPTURE_S3_TEST_ACCESS_KEY:-}
      - RUSTFS_SECRET_KEY=${CAPTURE_S3_TEST_SECRET_KEY:-}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=false
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          mode: 01777
    ports:
      - "127.0.0.1:${CAPTURE_S3_TEST_PORT:-9318}:9000"
    networks:
      - capture_store
      - default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - capture-s3-test

networks:
  app:
  data:
  capture_internal:
    internal: true
  capture_egress:
  # store network: the browser joins it in S1c; internal so it leads nowhere else
  capture_store:
    internal: true

volumes:
  db_data:
  capture_spool:
  capture_proxylog:
  capture_images:
  capture_config:
