default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # Basic hygiene — fast, no external deps
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.svg$'
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]

  # Secret scanning — catches credentials before they leave the machine
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # Block commits/messages that reference a domain, IP, or CIDR currently
  # configured as a live Target in the dev DB — see scripts/refresh_target_denylist.py
  # for why this exists and how the snapshot it checks against is built.
  - repo: local
    hooks:
      - id: target-domain-check-diff
        name: Check staged changes for live Target values
        entry: python scripts/check_target_domains.py --stage pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: target-domain-check-message
        name: Check commit message for live Target values
        entry: python scripts/check_target_domains.py --stage commit-msg
        language: system
        stages: [commit-msg]
