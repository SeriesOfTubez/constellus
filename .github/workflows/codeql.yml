name: CodeQL

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    # "pr/**" so a STACKED pull request — one based on another pr/* branch
    # rather than directly on dev — is still gated. Without it this workflow
    # filters itself out for every PR but the bottom of a stack, which is a
    # gate that runs where the work is not.
    branches: ["main", "dev", "pr/**"]
  schedule:
    - cron: '30 7 * * 1'  # Weekly Monday 07:30 UTC — offset from Dependabot (08:00)

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
