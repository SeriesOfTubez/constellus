name: Docs

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs (strict — fail on warnings)
        run: mkdocs build --strict

  # No separate "trigger RTD" job: Read the Docs' own GitHub App integration
  # rebuilds automatically on every push to dev via its own webhook — a
  # manual API-triggered rebuild here would be redundant, and worse, a
  # misleading one (curl doesn't fail on an HTTP error without -f, so an
  # invalid/missing token would silently "succeed" here while doing nothing).
