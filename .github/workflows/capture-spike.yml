name: Capture Spike

# Runs the capture egress spike (scripts/capture_spike.sh) against the real
# containers. Informational: not a required status check.
on:
  pull_request:
    paths:
      - "capture-browser/**"
      - "capture-proxy/**"
      - "docker-compose.yml"
      - "scripts/capture_spike.sh"
      - ".github/workflows/capture-spike.yml"
  push:
    branches: [dev, main]
    paths:
      - "capture-browser/**"
      - "capture-proxy/**"
      - "docker-compose.yml"
      - "scripts/capture_spike.sh"
      - ".github/workflows/capture-spike.yml"

permissions:
  contents: read

jobs:
  spike:
    name: Capture egress spike
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run capture spike
        run: bash scripts/capture_spike.sh
